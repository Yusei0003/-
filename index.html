<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通費・謝礼金 取りまとめ | KESEN LARUS BASKETBALL CLUB</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>交通費・謝礼金 取りまとめ</h1>
  <p class="subtitle">KESEN LARUS BASKETBALL CLUB 交通費等及び謝礼金支給規程 対応</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="entry">入力</button>
  <button class="tab-btn" data-tab="list">一覧</button>
  <button class="tab-btn" data-tab="summary">月次集計</button>
</nav>

<main>
  <!-- ============ 入力タブ ============ -->
  <section id="panel-entry" class="tab-panel active">
    <form id="entry-form">
      <div class="form-grid form-grid-compact">
        <label class="field-group">
          日付
          <input type="date" id="f-date" required>
        </label>

        <label class="field-group">
          区分
          <select id="f-category">
            <option value="practice">通常練習</option>
            <option value="weekend">土日祝日活動</option>
          </select>
        </label>

        <label class="field-group" id="group-location">
          活動場所
          <select id="f-location">
            <option value="in">気仙管内</option>
            <option value="out">気仙管外</option>
          </select>
        </label>

        <label class="field-group" id="group-duration">
          拘束時間
          <select id="f-duration">
            <option value="half">半日（4h以内）</option>
            <option value="full">1日（4h超）</option>
          </select>
        </label>

        <div class="field-group unit-amount-box">
          支給額
          <div class="unit-amount" id="f-unit-amount">¥500 / 人</div>
        </div>
      </div>

      <div class="staff-checklist">
        <div class="staff-checklist-header">
          <span>出席した対象者を選択</span>
          <button type="button" id="f-select-all" class="btn-secondary">全員選択</button>
        </div>
        <div id="staff-checkboxes" class="staff-checkbox-grid"></div>
      </div>

      <label class="field-group note-field">
        備考（任意）
        <input type="text" id="f-note" placeholder="必要な場合のみ">
      </label>

      <button type="submit" class="btn-primary">登録する（<span id="f-select-count">0</span>名）</button>
    </form>
  </section>

  <!-- ============ 一覧タブ ============ -->
  <section id="panel-list" class="tab-panel">
    <div class="filter-bar">
      <label>対象月
        <select id="list-month-filter"><option value="">すべての月</option></select>
      </label>
      <label>氏名で絞り込み
        <input type="text" id="list-name-filter" placeholder="氏名">
      </label>
      <div class="filter-stats">
        <span id="list-count">0 件</span>
        <span>合計 <strong id="list-total">¥0</strong></span>
      </div>
    </div>
    <div class="table-wrap">
      <table class="sheet-table">
        <thead>
          <tr>
            <th>日付</th><th>氏名</th><th>区分</th><th>内容</th><th>支給額</th><th>備考</th><th></th>
          </tr>
        </thead>
        <tbody id="list-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- ============ 月次集計タブ ============ -->
  <section id="panel-summary" class="tab-panel">
    <div class="filter-bar">
      <label>対象月
        <select id="summary-month"><option value="">対象月を選択</option></select>
      </label>
      <div class="filter-stats">
        <span id="summary-count">0 名</span>
        <span>合計 <strong id="summary-total">¥0</strong></span>
        <span>支払予定日 <strong id="summary-paydate">-</strong></span>
        <span>活動日数 <strong id="summary-active-days">0</strong> 日</span>
      </div>
    </div>
    <div class="table-wrap">
      <table class="sheet-table">
        <thead><tr><th>氏名</th><th>月間支給額</th><th>稼働率</th></tr></thead>
        <tbody id="summary-tbody"></tbody>
      </table>
    </div>

    <button type="button" id="btn-receipt-pdf" class="btn-primary receipt-pdf-btn">領収書をPDF出力（対象月・印刷ダイアログでPDF保存）</button>

    <details class="contact-settings">
      <summary>領収書用の連絡先・住所を設定（この端末にのみ保存されます）</summary>
      <div class="contact-settings-body" id="contact-settings-body"></div>
    </details>
  </section>
</main>

<div id="toast" class="toast"></div>
<div id="receipt-print-area" class="receipt-print-area"></div>

<script src="app.js"></script>
</body>
</html>
